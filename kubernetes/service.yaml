apiVersion: v1
kind: Service
metadata:
  labels:
    app: sidecar
    cnpg.io/pluginName: sidecar.tkdb.ai
  annotations:
    cnpg.io/pluginClientSecret: sidecar-client-tls
    cnpg.io/pluginServerSecret: sidecar-server-tls
    cnpg.io/pluginPort: "9090"
  name: sidecar
spec:
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app: sidecar
